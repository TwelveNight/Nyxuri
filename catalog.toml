# 包目录清单 — 声明「装但不部署」的软件。这不是单元（unit-model §2）：
# 目录条目不携带配置文件、没有账本生命周期，只服务两处同源消费：
# `nyxuri deps apps` 菜单与 packaging/gen-deps.py 的 optdepends。
# 显示名（双语）住 nyxuri/translations.toml 的 app_* 键，此处不重复。

[brave-origin]
label = "Brave Origin"
category = "browser"
packages_aur = ["brave-origin-bin"]

[flclash]
label = "FlClash"
category = "proxy"
detect = "flclash"
packages_aur = ["flclash-bin"]

[quickshell]
# Nyxuri Shell 的运行时底座：随 Noctalia AUR 传递引入，单独选用
# nyxuri-shell 时由这里声明（shell/KNOWN-ISSUES 缺口清算）。
label = "Quickshell"
category = "shell-runtime"
detect = "quickshell"
packages_aur = ["quickshell"]

[kdenlive]
label = "Kdenlive"
category = "video"
packages = ["kdenlive"]

[libreoffice]
label = "LibreOffice"
category = "office"
packages = ["libreoffice-fresh"]

[lutris]
label = "Lutris"
category = "game"
packages = ["lutris"]

[missioncenter]
label = "Mission Center"
category = "system"
detect = "mission-center"
packages = ["mission-center"]

[motrix]
label = "Motrix"
category = "download"
packages_aur = ["motrix"]

[nautilus]
label = "Nautilus"
category = "system"
packages = ["nautilus"]

[obs]
label = "OBS Studio"
category = "video"
detect = "obs"
packages = ["obs-studio"]

[protonplus]
label = "ProtonPlus"
category = "game"
packages_aur = ["protonplus"]

[qq]
label = "QQ"
category = "social"
packages_flatpak = ["com.qq.QQ"]

[shelly]
label = "Shelly"
category = "terminal"
detect = "shelly"
packages_aur = ["shelly-bin"]

[spotify]
label = "Spotify"
category = "media"
packages_flatpak = ["com.spotify.Client"]

[steam]
label = "Steam"
category = "game"
packages = ["steam"]

[telegram]
label = "Telegram"
category = "social"
packages = ["telegram-desktop"]

[vscode]
label = "Visual Studio Code"
category = "dev"
detect = "code"
packages_aur = ["visual-studio-code-bin"]

[wechat]
label = "微信 (WeChat)"
category = "social"
packages_flatpak = ["com.tencent.WeChat"]
