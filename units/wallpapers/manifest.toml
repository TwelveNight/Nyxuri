# 壁纸单元 — 离线 fallback 蓝图 + 共享生活区
#
# 生活区是 ~/Pictures/Wallpapers（merge 声明，共享空间）：on 只无碰合流
# 蓝图文件（已存在的永不覆盖），off 只撤回蓝图具名文件；外部壁纸包是
# 用户域内容，由 hooks/install-pack 手动安装，不入账本。
optional = true
packages = []
target = "~/Pictures/Wallpapers"
merge = true
label = "Wallpapers"
category = "system"
chmod = ["hooks/install-pack"]
